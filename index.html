<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa & Cider</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#2a2a2a;--sub:#8a8a8a;--line:#d9d9d9;--card:#fff;--shadow:0 8px 30px rgba(0,0,0,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable','Inter',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#f4f4f4 0%,#fff 60%);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* 관리자 하트 */
.heart{position:fixed;top:22px;right:38px;font-size:15px;line-height:1;color:#b9b9b9;z-index:20;transition:color .2s}
.heart:hover{color:#666}
.heart.off{pointer-events:none;cursor:default;opacity:.5}

.title{position:absolute;left:70px;top:218px;font-size:38px;font-weight:800;line-height:1.12;letter-spacing:-.02em}

.stage{position:absolute;left:50%;top:220px;transform:translateX(-50%);width:336px}
.arch{position:relative;width:336px;height:494px;border-radius:168px 168px 0 0;overflow:hidden;
  background:#e9e9e9;box-shadow:0 24px 40px -12px rgba(0,0,0,.25)}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#b5b5b5;font-size:11px;letter-spacing:.25em}
.arch.has-img .ph{display:none}
.vtext{position:absolute;left:calc(100% + 14px);bottom:0;writing-mode:vertical-rl;font-size:9px;letter-spacing:.32em;color:#777;white-space:nowrap}

.menu{position:absolute;left:calc(50% + 232px);top:598px;width:212px;list-style:none}
.menu li{display:flex;align-items:center;gap:10px;height:43px;font-size:11px;color:#777}
.menu li i{flex:1;border-top:1px dashed var(--line)}
.menu li b{font-size:17px;font-weight:600;color:#777;letter-spacing:-.01em}

.widget{position:fixed;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.05);z-index:10}
.w-head{display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:36px;
  border-bottom:1px dashed var(--line);font-size:9px;letter-spacing:.3em;color:#777;font-weight:600}
.w-head .tools{display:flex;gap:10px;align-items:center}
.w-head svg{width:14px;height:14px;stroke:#444;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.widget.collapsed .w-body{display:none}
.widget.collapsed .w-head{border-bottom-color:transparent}

/* 캘린더 */
.cal{right:36px;top:135px;width:210px}
.cal .w-body{padding:10px 10px 12px}
.cal-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);margin:0 -10px;padding:0 13px 6px}
.cal-month{display:flex;align-items:baseline;gap:6px}
.cal-month .num{font-size:30px;font-weight:800;letter-spacing:-.03em}
.cal-month .en{font-size:8px;font-weight:700;letter-spacing:.2em;line-height:1.35}
.cal-month .en small{display:block;font-weight:500;color:#999;font-size:8px}
.nav{display:flex;gap:4px}
.nav button{width:19px;height:19px;border:1px solid #ddd;border-radius:50%;display:grid;place-items:center}
.nav svg{width:9px;height:9px;stroke:#555;fill:none;stroke-width:2}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;margin-top:6px;text-align:center}
.grid .dow{font-size:7px;color:#999;height:20px;line-height:20px}
.grid .d{font-size:9px;height:24.5px;display:grid;place-items:center;color:#222}
.grid .d.wk{color:#888}
.grid .d span{width:20px;height:20px;display:grid;place-items:center;border-radius:50%}
.grid .d.today span{background:#2a2a2a;color:#fff;font-weight:700}
.grid .d{position:relative}
.grid .d[data-d]{cursor:pointer}
.grid .d.has::after{content:"";position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:#d9775c}
.grid .d.sel:not(.today) span{box-shadow:0 0 0 1px #2a2a2a inset}
.sched{margin:8px -10px 0;border-top:1px solid #eee;padding:10px 10px 2px}
.sched:empty{display:none}
.sc-h{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;color:#999;font-weight:700;margin-bottom:4px}
.sc{display:flex;gap:8px;padding:6px 0;font-size:9px;border-bottom:1px dashed #e4e4e4}
.sc:last-child{border-bottom:0}
.sc time{width:30px;flex:none;color:#999;font-size:8px;padding-top:1px;font-variant-numeric:tabular-nums}
.sc b{font-weight:600;display:block}
.sc small{display:block;color:#999;font-size:8px;margin-top:2px;line-height:1.4;white-space:pre-line}
.sc-empty{font-size:8.5px;color:#bbb;padding:4px 0 8px}
/* 메모: 메인에서는 숨김, 제목 꾹 누르면 팝업 */
.sc b.hm{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
.sc b.hm::after{content:"";display:inline-block;width:3px;height:3px;margin-left:4px;border-radius:50%;background:#d9775c;vertical-align:middle;opacity:.7}
.memo-pop{position:fixed;z-index:50;max-width:200px;padding:9px 11px;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:12px;box-shadow:var(--shadow);font-size:10px;line-height:1.5;color:#555;white-space:pre-line;word-break:break-word}
.ck{width:11px;height:11px;border:1px solid #bdbdbd;border-radius:3px;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff}
.ck.on{background:#2a2a2a;border-color:#2a2a2a}
.ck.on::after{content:"";width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.ck.own{cursor:pointer}
.sc.done b,.sc.done small,.sc.done time{text-decoration:line-through;color:#aaa}
.dday{margin:8px -10px 0;border-top:1px solid #eee;padding:10px 10px 0}
.dday:empty{display:none}
.dday-main{background:#f1f1f1;border-radius:12px;padding:10px 11px;display:flex;align-items:center;gap:6px;height:37px;margin-bottom:6px}
.dday-main .k{font-size:9px;font-weight:600}
.dday-main .n{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dday-main .t{margin-left:3px;line-height:1.25;min-width:0}
.dday-main .t b{display:block;font-size:8.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday-main .t small{font-size:7px;color:#999;letter-spacing:.12em}
.ev{display:flex;align-items:center;gap:8px;padding:7px 0 6px;border-bottom:1px dashed #e4e4e4;font-size:8px}
.ev:last-child{border-bottom:0}
.ev em{font-style:normal;border:1px solid #ddd;border-radius:10px;padding:2px 8px;font-size:7.5px;font-weight:600;min-width:34px;text-align:center}
.ev span{flex:1}
.ev time{color:#999;font-size:8px}

/* 뮤직 */
.music{left:12px;bottom:6px;width:290px}
.music .w-head{height:44px;padding:0 14px}
.music .w-body{padding:14px}
.track{display:flex;align-items:center;gap:13px}
.thumb{position:relative;width:54px;height:54px;border-radius:50%;overflow:hidden;background:#cfcfcf;flex:none;
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:20px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);z-index:2}
.thumb.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{min-width:0}
.meta .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .by{font-size:11px;color:#888;margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;margin-top:15px;font-size:10px;color:#555;font-variant-numeric:tabular-nums}
.bar input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;outline:0;cursor:pointer;
  background:linear-gradient(90deg,#2a2a2a var(--p,0%),#d3d3d3 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:#2a2a2a}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:#2a2a2a}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ctrl .mid{display:flex;align-items:center;gap:16px}
.ctrl .skip svg{width:12px;height:12px;fill:#222}
.play{width:36px;height:36px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center}
.play svg{width:13px;height:13px;fill:#fff}
.vol{display:flex;align-items:center;gap:8px;width:92px}
.vol svg{width:11px;height:11px;fill:#777;flex:none}
.vol input{width:70px}
#yt{position:fixed;left:-9999px;top:0;width:200px;height:200px;opacity:0;pointer-events:none}

/* 접힌 음악 = 알약 */
.music .mini{display:none;align-items:center;gap:10px;padding:8px 12px 8px 8px}
.music.collapsed{width:254px;border-radius:30px;left:16px;bottom:16px}
.music.collapsed .w-head,.music.collapsed .w-body{display:none}
.music.collapsed .mini{display:flex}
.mini .meta{flex:1;min-width:0}
.mini .name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .by{font-size:10px;color:#888;margin-top:1px}
.thumb.sm{width:36px;height:36px;font-size:14px}
.thumb.sm::after{width:8px;height:8px}
.play.sm{width:34px;height:34px;flex:none}
.play.sm svg{width:11px;height:11px}
.expand{width:22px;height:22px;display:grid;place-items:center;flex:none}
.expand svg{width:13px;height:13px;stroke:#888;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.expand:hover svg{stroke:#222}

/* 메뉴 링크 */
.menu li a{display:block}
.menu li a b{transition:color .2s}
.menu li a:hover b{color:#2a2a2a}

/* 페이지 전환 */
body[data-view="sec"] .home-only{display:none !important}
body:not([data-view="sec"]) .page{display:none}
.page{position:absolute;left:74px;top:172px;width:min(1000px,calc(100vw - 148px))}
.back{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.3em;color:#555}
.back svg{width:8px;height:8px;stroke:#555;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:#111}
.pg-title{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:20px}
.pg-sub{font-size:9px;letter-spacing:.3em;color:#777;margin-top:14px}
.oc-scroll{margin-top:38px;height:calc(100vh - 318px - 130px);min-height:300px;overflow-y:auto;padding-right:16px;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.oc-scroll::-webkit-scrollbar{width:3px}
.oc-scroll::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:3px}
.oc-scroll::-webkit-scrollbar-track{background:transparent}
.oc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,211px));gap:30px 29px;padding-bottom:40px}
.oc-img{position:relative;aspect-ratio:211/281;border-radius:12px;overflow:hidden;border:1px solid #e6e6e6;background:#ececec}
.oc-img img{width:100%;height:100%;object-fit:cover;display:block}
.oc-img.is-soon img{filter:grayscale(1) brightness(.97);transition:filter .3s}
.oc-noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;letter-spacing:.25em;color:#b5b5b5}
.soon{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;
  background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:14px;padding:5px 11px;font-size:8px;font-weight:800;letter-spacing:.18em;color:#222}
.soon svg{width:9px;height:9px}
.oc-info{margin-top:8px;border-left:1px solid #cfcfcf;padding-left:9px}
.oc-info .no{font-size:8px;color:#888;letter-spacing:.15em}
.oc-info .nm{font-size:15px;font-weight:800;line-height:1.3;margin-top:1px}
.oc-info .pr{font-size:8px;color:#888;letter-spacing:.12em;margin-top:1px}
.oc-empty{grid-column:1/-1;font-size:12px;color:#aaa;padding:30px 0}


/* Pair 슬라이드 */
.pair-only,.pair-nav{display:none}
body[data-sec="pair"] .pair-only{display:block}
body[data-sec="pair"] .grid-only{display:none}
body[data-sec="pair"] .pair-nav{display:flex}
.pair-nav{position:absolute;right:0;top:44px;align-items:center;gap:12px}
.pair-nav .pc{display:flex;align-items:baseline;gap:5px}
.pair-nav .pc b{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pair-nav .pc small{font-size:9px;font-weight:700;letter-spacing:.15em;color:#777}
.pdots{display:flex;align-items:center;gap:5px;margin:0 4px}
.pdots i{display:block;width:5px;height:5px;border-radius:3px;background:#d0d0d0;cursor:pointer;transition:width .25s,background .25s}
.pdots i.on{width:18px;background:#2a2a2a}
.pair-nav button.pn{width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;display:grid;place-items:center;transition:border-color .2s}
.pair-nav button.pn:hover{border-color:#2a2a2a}
.pair-nav button.pn svg{width:12px;height:12px;stroke:#333;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pair-main{display:flex;align-items:center;gap:43px;margin-top:46px;transition:opacity .16s}
.pair-main.fade{opacity:0}
.pair-img{position:relative;flex:none;width:min(535px,52vw);aspect-ratio:535/366;border-radius:26px;overflow:hidden;border:1px solid #e3e3e3;background:#ececec;box-shadow:0 14px 34px -14px rgba(0,0,0,.18)}
.pair-img img{width:100%;height:100%;object-fit:cover;display:block}
.pair-info{border-left:2px solid #cfcfcf;padding:6px 0 6px 16px;min-width:0}
.pair-info .no{font-size:8px;color:#888;letter-spacing:.15em}
.pair-info .nm{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px;word-break:keep-all}
.pair-meta{display:flex;align-items:center;gap:8px;margin-top:12px}
.pair-meta b{background:#efefef;border-radius:10px;padding:3px 9px;font-size:9.5px;font-weight:800}
.pair-meta span{font-size:8px;letter-spacing:.15em;color:#999;font-weight:700}
.pair-desc{font-size:10.5px;color:#555;margin-top:14px;line-height:1.6;white-space:pre-line}
.pbtn{display:inline-flex;align-items:center;gap:9px;margin-top:20px;height:34px;padding:0 8px 0 16px;border-radius:17px;border:1px solid #ddd;background:rgba(255,255,255,.7);font-size:8px;font-weight:800;letter-spacing:.2em;color:#444;max-width:100%}
.pbtn .lk{width:18px;height:18px;border-radius:50%;background:#f1f1f1;display:grid;place-items:center;flex:none}
.pbtn .lk svg{width:9px;height:9px}
.pbtn.open{background:#2a2a2a;border-color:#2a2a2a;color:#fff;cursor:pointer;transition:transform .2s}
.pbtn.open:hover{transform:translateY(-1px)}
.pbtn.open .lk{background:rgba(255,255,255,.18)}
.pbtn.open .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn.plain{padding-right:16px}
@media (max-width:1000px){
  .pair-nav{position:static;margin-top:18px}
  .pair-main{flex-direction:column;align-items:stretch;gap:22px;margin-top:26px}
  .pair-img{width:100%}
}

@media (max-width:1000px){
  body{padding:48px 16px 330px}
  .title,.stage,.menu{position:static;transform:none}
  .title{margin:8px 0 20px}
  .stage{margin:0 auto}
  .menu{width:100%;max-width:336px;margin:30px auto 0}
  .vtext{display:none}
  .cal{position:relative;right:auto;top:auto;margin:30px auto 0}
  .music{left:8px;right:8px;width:auto;max-width:360px;bottom:8px}
  .heart{right:20px}
  .page{position:static;width:100%}
  .oc-scroll{height:auto;overflow:visible;padding-right:0}
  .oc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}
  .music.collapsed{right:auto;width:254px;left:8px;bottom:8px}
}

/* ===== Me / Profile ===== */
#view-me{display:none}
body[data-sec="me"] #view-me{display:grid;grid-template-columns:250px minmax(0,1fr);gap:64px;width:min(1040px,calc(100vw - 148px))}
body[data-sec="me"] #view-sec{display:none}
.me-av{width:112px;height:112px;margin-top:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px #ddd,0 8px 20px -8px rgba(0,0,0,.28);background:#e4e4e4;overflow:hidden}
.me-av img{width:100%;height:100%;object-fit:cover;display:block}
.me-name{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
.me-handle{font-size:8px;letter-spacing:.3em;color:#888;margin-top:6px}
.me-bar{display:flex;align-items:flex-end;justify-content:space-between;height:62px}
.me-tabs{display:flex;align-items:flex-end}
.me-tab{position:relative;height:36px;padding:0 18px 3px;font-size:11px;font-weight:700;color:#777;display:flex;align-items:center;transition:color .2s}
.me-tab:hover{color:#222}
.me-tab.on{height:40px;margin-bottom:-1px;background:#fff;color:#111;border-radius:16px 16px 0 0;padding-bottom:6px}
.me-tab.on::after{content:"";position:absolute;left:50%;bottom:5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#222}
.me-tab.on i{position:absolute;bottom:0;width:16px;height:16px}
.me-tab.on i.l{left:-16px;background:radial-gradient(circle at 0 0,transparent 16px,#fff 16.5px)}
.me-tab.on i.r{right:-16px;background:radial-gradient(circle at 100% 0,transparent 16px,#fff 16.5px)}
.me-tab.on:first-child i.l{display:none}
.me-cnt{margin-bottom:6px;display:flex;align-items:baseline;gap:5px}
.me-cnt b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.me-cnt small{font-size:9px;font-weight:700;letter-spacing:.15em;color:#777}
.me-card{background:#fff;border-radius:24px;display:flex;overflow:hidden;height:clamp(380px,calc(100vh - 430px),700px);
  box-shadow:0 26px 40px -20px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.04)}
.me-card.f1{border-top-left-radius:0}
.me-body{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 26px 24px;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.me-body::-webkit-scrollbar{width:4px}.me-body::-webkit-scrollbar-thumb{background:#cfcfcf;border-radius:4px}
.me-body .sec{margin-bottom:26px}.me-body .sec:last-child{margin-bottom:4px}
.sh{display:flex;align-items:center;gap:10px}
.sh em{font-style:normal;background:#2a2a2a;color:#fff;font-size:8.5px;font-weight:700;border-radius:10px;height:19px;padding:0 8px;display:grid;place-items:center}
.sh h3{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.sh i{flex:1;border-top:1px solid #ddd}
.sh span{font-size:8px;font-weight:600;letter-spacing:.3em;color:#777;white-space:nowrap}
.sh.sm h3{font-size:12.5px}
.sb{margin:14px 0 0 33px}
.fl{display:flex}
.fl div{padding:0 26px;border-left:1px solid #ddd}.fl div:first-child{padding-left:0;border:0}
.fl small{display:block;font-size:8px;font-weight:700;letter-spacing:.2em;color:#777}
.fl b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.nr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;padding:12px 0;border-bottom:1px dashed #d9d9d9}
.nr:first-child{padding-top:0}
.gl{font-size:8.5px;font-weight:800;letter-spacing:.2em;color:#555;margin-right:10px}
.nr .gl:first-child{width:80px;margin-right:0}
.nr .gl:not(:first-child){margin-left:20px}
.pl{display:inline-flex;height:26px;border-radius:13px;overflow:hidden;border:1px solid #ddd;background:#fff;margin-right:6px;font-size:12px}
.pl i{font-style:normal;background:#efefef;color:#888;font-size:8px;font-weight:700;padding:0 9px;display:grid;place-items:center}
.pl b{font-weight:700;color:#222;padding:0 10px;display:grid;place-items:center}
.pl.dk{height:28px;border-color:#2a2a2a}.pl.dk i{background:#454545;color:#fff}.pl.dk b{background:#2a2a2a;color:#fff;font-size:13px}
.bl{list-style:none;padding-top:8px}
.bl li{position:relative;font-size:11.5px;color:#444;padding:7px 0 7px 14px}
.bl li::before{content:"";position:absolute;left:0;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#cfcfcf}
.me-body mark{background:#e6e6e6;color:inherit;border-radius:3px;padding:1px 2px}
.ng{display:flex;gap:14px;margin:14px 0 0 33px;padding:12px 22px 12px 16px;background:#2a2a2a;color:#fff;border-radius:20px}
.ng .ex{width:22px;height:22px;flex:none;margin-top:9px;border:1px solid #999;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.ng ol{flex:1;list-style:none}
.ng li{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed #555;font-size:12px;font-weight:700}

.fc{display:block;border:1px solid #e3e3e3;border-radius:18px;overflow:hidden;background:#fff;transition:transform .2s,border-color .2s}
a.fc:hover{transform:translateY(-2px);border-color:#bbb}
.fi{position:relative;aspect-ratio:276/116;background:#eee;overflow:hidden}.fi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid #eee}
.ft b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em}
.ft small{display:block;font-size:10px;color:#888;margin-top:2px}
.ar{width:24px;height:24px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none}.ar svg{width:9px;height:9px}
.pg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
.pi{display:flex;gap:2px;aspect-ratio:3/2;margin-top:9px;border-radius:12px;overflow:hidden;background:#fff}
.pi.o{aspect-ratio:3/4}
.pim{position:relative;flex:1 1 0;min-width:0;background:#ececec}
.pim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg2.oc{grid-template-columns:repeat(3,minmax(0,1fr))}
.pg2.oc .sh i{display:none}.pg2.oc .sh span{margin-left:auto}
.sh h3{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pnm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.pw{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;min-width:0}
.rl{font-style:normal;font-size:7px;font-weight:800;letter-spacing:.08em;padding:2px 5px;border-radius:4px;border:1px solid #ccc;color:#888}
.rl.dk{background:#2a2a2a;border-color:#2a2a2a;color:#fff}
.pb{display:flex;gap:4px;margin-top:6px}
.pb button{flex:1;height:22px;border:1px solid #ddd;border-radius:11px;font-size:8.5px;font-weight:700;color:#555;display:flex;align-items:center;justify-content:center;gap:4px}
.pb button:hover{border-color:#2a2a2a;color:#111}.pb button.na{opacity:.4}
.pb svg{width:9px;height:9px}
.pb.pc{margin-top:4px}.pb.pc button{height:24px}

  body[data-sec="me"] #view-me{grid-template-columns:1fr;gap:26px;width:100%}
  .me-card{height:auto}.me-body{overflow:visible}
  .fg,.sb,.ng{margin-left:0}.fg,.pg2{grid-template-columns:minmax(0,1fr)}.pg2.oc{grid-template-columns:repeat(2,minmax(0,1fr))}
}

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');

/* ===== 데이터 로드: data.js 와 이 브라우저의 임시 저장본 중 더 최신인 것 ===== */
function loadData(){
  const base = window.SITE_DATA || {};
  let d = base;
  try{
    const ls = JSON.parse(localStorage.getItem('sc_data') || 'null');
    if (ls && (ls.updatedAt||0) > (base.updatedAt||0)) d = ls;
  }catch(e){}
  return Object.assign({title:[],menu:[],playlist:[],ddays:[],schedule:[],oc:{title:'OC',subtitle:'ORIGINAL CHARACTERS',characters:[]},pair:{title:'Pair',subtitle:'DREAM & PAIRS',characters:[]},me:{title:'Me',subtitle:'ABOUT ME',characters:[]},volume:60,showCalendar:true,mainImage:'',verticalText:''}, d);
}
const DATA = loadData();

/* 파비콘 */
if (DATA.favicon){
  [['icon'],['apple-touch-icon']].forEach(([rel])=>{
    let l = document.querySelector(`link[rel="${rel}"]`);
    if(!l){ l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
    l.href = DATA.favicon;
  });
}

/* ===== 타이틀/메뉴/이미지 ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#title').innerHTML = DATA.title.map(esc).join('<br>');
document.title = DATA.title.join(' ') || 'Home';
$('#vtext').textContent = DATA.verticalText;
const SEC_KEYS = ['oc','pair','me'];
const autoHref = l => { const k = String(l||'').trim().toLowerCase(); return SEC_KEYS.includes(k) ? '#'+k : ''; };
const MENU = DATA.menu.map(m => typeof m === 'string' ? {label:m, href:autoHref(m)} : {label:m.label, href:m.href || autoHref(m.label)});
$('#menu').innerHTML = MENU.map((m,i)=>{
  const b = `<b>${esc(m.label)}</b>`;
  const ext = /^https?:/.test(m.href||'') ? ' target="_blank" rel="noopener"' : '';
  return `<li>${pad(i+1)}<i></i>${m.href ? `<a href="${esc(m.href)}"${ext}>${b}</a>` : b}</li>`;
}).join('');
if (DATA.mainImage){ const img=$('#mainImg'); img.src=DATA.mainImage; img.hidden=false; $('#arch').classList.add('has-img'); }

/* ===== 위젯 접기 ===== */
document.querySelectorAll('[data-toggle]').forEach(b=>{
  b.onclick = () => b.closest('.widget').classList.toggle('collapsed');
});

/* ===== 캘린더 ===== */
if (DATA.showCalendar === false) $('#cal').style.display = 'none';
const today = new Date(); today.setHours(0,0,0,0);
let view = new Date(today.getFullYear(), today.getMonth(), 1);
let sel = new Date(today);
const SCHED = (DATA.schedule||[]).filter(e => e && e.date && e.title);
const evOn = (y,m,d) => SCHED.filter(e=>{
  const [Y,M,D2] = e.date.split('-').map(Number);
  return e.repeat ? (M===m+1 && D2===d) : (Y===y && M===m+1 && D2===d);
}).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
let memoPop = null;
const closeMemo = () => { if(memoPop){ memoPop.remove(); memoPop = null; } };
function showMemo(el, text){
  closeMemo();
  const p = document.createElement('div'); p.className = 'memo-pop'; p.textContent = text;
  document.body.appendChild(p);
  const r = el.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  const x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  let y = r.bottom + 6; if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  memoPop = p;
}
document.addEventListener('pointerdown', e => { if (memoPop && !e.target.closest('.memo-pop')) closeMemo(); });
window.addEventListener('scroll', closeMemo, {passive:true});
function renderSched(){
  closeMemo();
  const box = $('#sched');
  if(!SCHED.length){ box.innerHTML = ''; return; }
  const y = sel.getFullYear(), m = sel.getMonth(), d = sel.getDate();
  const list = evOn(y,m,d);
  const rows = list.map((e,i)=>`<div class="sc ${e.done?'done':''}"><span class="ck ${e.done?'on':''} ${OWNER?'own':''}" data-i="${i}"></span>${e.time?`<time>${esc(e.time)}</time>`:''}<span><b class="${e.memo?'hm':''}" data-m="${i}">${esc(e.title)}</b></span></div>`).join('');
  box.innerHTML = `<div class="sc-h"><span>${pad(m+1)}.${pad(d)} SCHEDULE</span><span id="scst">${list.length||''}</span></div>` +
    (list.length ? rows : '<div class="sc-empty">등록된 일정이 없어요</div>');
  box.querySelectorAll('b.hm').forEach(el => {
    const memo = list[+el.dataset.m].memo;
    let t = null, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(t); t = null; };
    el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; cancel(); t = setTimeout(() => { t = null; showMemo(el, memo); }, 450); });
    el.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) cancel(); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
  if (OWNER) box.querySelectorAll('.ck.own').forEach(el => el.onclick = () => toggleDone(list[+el.dataset.i]));
}

/* 일정 체크: 관리자(토큰/관리자 접속 기록이 있는 브라우저)만 가능 */
const lsJSON = k => { try{ return JSON.parse(localStorage.getItem(k) || '{}'); }catch(e){ return {}; } };
const OWNER = !!(localStorage.getItem('sc_owner') || lsJSON('sc_gh').token);
const sKey = e => `${e.date}|${e.time||''}|${e.title}`;
function scStatus(t){
  const s = $('#scst'); if(!s) return;
  s.textContent = t;
  setTimeout(()=>{ const s2 = $('#scst'); if(s2) s2.textContent = evOn(sel.getFullYear(),sel.getMonth(),sel.getDate()).length || ''; }, 2600);
}
async function remoteDone(g, key, done){
  const base = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/data.js`;
  const head = {Authorization:'Bearer '+g.token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'};
  const br = g.branch || 'main';
  for(let a=0; a<3; a++){
    const r = await fetch(`${base}?ref=${encodeURIComponent(br)}&t=${Date.now()}`, {cache:'no-store', headers:head});
    if(!r.ok) return false;
    const j = await r.json();
    if(!j.content) return false;
    let obj;
    try{
      const txt = decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
      obj = JSON.parse(txt.replace(/^window\.SITE_DATA\s*=\s*/,'').replace(/;\s*$/,''));
    }catch(e){ return false; }
    const it = (obj.schedule||[]).find(x => sKey(x) === key);
    if(!it) return 'nf';
    it.done = !!done; obj.updatedAt = Date.now();
    const out = 'window.SITE_DATA = ' + JSON.stringify(obj, null, 2) + ';\n';
    const p = await fetch(base, {method:'PUT', cache:'no-store', headers:head,
      body: JSON.stringify({message:'Toggle schedule', content:btoa(unescape(encodeURIComponent(out))), branch:br, sha:j.sha})});
    if(p.ok) return true;
    if(p.status !== 409) return false;
    await new Promise(res => setTimeout(res, 800));
  }
  return false;
}
async function toggleDone(e){
  e.done = !e.done;
  DATA.updatedAt = Date.now();
  try{ localStorage.setItem('sc_data', JSON.stringify(DATA)); }catch(x){}
  renderSched();
  const g = lsJSON('sc_gh');
  if(!(g.token && g.owner && g.repo)){ scStatus('이 브라우저에만 저장'); return; }
  scStatus('저장 중…');
  const ok = await remoteDone(g, sKey(e), e.done);
  scStatus(ok === true ? '✓ 게시 완료' : ok === 'nf' ? '게시 전 일정이에요' : '게시 실패');
}
const MON = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  $('#cNum').textContent = m+1; $('#cMon').textContent = MON[m]; $('#cYear').textContent = y;
  let h = ['일','월','화','수','목','금','토'].map(d=>`<div class="dow">${d}</div>`).join('');
  const first = new Date(y,m,1).getDay(), last = new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++) h += '<div class="d"></div>';
  for(let d=1; d<=last; d++){
    const wd = new Date(y,m,d).getDay();
    const isT = (y===today.getFullYear() && m===today.getMonth() && d===today.getDate());
    const has = evOn(y,m,d).length > 0;
    const isS = (y===sel.getFullYear() && m===sel.getMonth() && d===sel.getDate());
    h += `<div class="d ${wd===0||wd===6?'wk':''} ${isT?'today':''} ${has?'has':''} ${isS?'sel':''}" data-d="${d}"><span>${d}</span></div>`;
  }
  $('#grid').innerHTML = h;
  $('#grid').querySelectorAll('[data-d]').forEach(el => el.onclick = () => { sel = new Date(y, m, +el.dataset.d); renderCal(); });
  renderSched();
}
$('#prev').onclick = () => { view.setMonth(view.getMonth()-1); renderCal(); };
$('#next').onclick = () => { view.setMonth(view.getMonth()+1); renderCal(); };
renderCal();

/* ===== 디데이 (관리자 페이지에서 추가한 것만 표시) ===== */
(function(){
  const since = [], until = [];
  (DATA.ddays||[]).forEach(e=>{
    if(!e.date) return;
    const p = e.date.split('-').map(Number);
    if(p.length<3 || p.some(isNaN)) return;
    const [Y,M,D] = p;
    if (e.type === 'since'){
      const n = Math.floor((today - new Date(Y,M-1,D))/864e5) + 1;
      since.push(`<div class="dday-main"><span class="k">D+</span><span class="n">${n}</span>
        <span class="t"><b>${esc(e.label||'')}</b><small>${Y}.${pad(M)}.${pad(D)} ~</small></span></div>`);
    } else {
      let t = new Date(Y,M-1,D);
      if (e.repeat){
        t = new Date(today.getFullYear(), M-1, D);
        if (t < today) t = new Date(today.getFullYear()+1, M-1, D);
      } else if (t < today) return;
      until.push({name:e.label||'', diff:Math.round((t-today)/864e5), md:`${pad(M)}.${pad(D)}`});
    }
  });
  until.sort((a,b)=>a.diff-b.diff);
  const evs = until.slice(0,3).map(e=>
    `<div class="ev"><em>${e.diff===0?'D-DAY':'D-'+e.diff}</em><span>${esc(e.name)}</span><time>${e.md}</time></div>`).join('');
  $('#dday').innerHTML = since.join('') + evs;
})();

/* ===== 뮤직 (YouTube IFrame API) ===== */
const tracks = (DATA.playlist||[]).length ? DATA.playlist : [{url:'',title:'',artist:'',thumb:''}];
let idx = 0, player = null, ready = false, playing = false;
const ytId = u => ((u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const fmt = s => { s=Math.floor(s||0); return Math.floor(s/60)+':'+pad(s%60); };

function setThumb(src){
  ['#thumb','#mThumb'].forEach(q=>{
    const t = $(q); t.innerHTML = '';
    if (src){ const i = document.createElement('img'); i.src = src; t.appendChild(i); t.style.background=''; }
    else { t.textContent = ((tracks[idx].title||'S')[0]).toUpperCase(); t.style.background='#bdbdbd'; }
  });
}
function setSeek(v){ const e=$('#seek'); e.value=v; e.style.setProperty('--p',(v/10)+'%'); }
function loadMeta(){
  const t = tracks[idx];
  $('#tName').textContent = t.title; $('#tBy').textContent = t.artist;
  $('#mName').textContent = t.title; $('#mBy').textContent = t.artist;
  setThumb(t.thumb || '');
  $('#open').style.display = t.url ? '' : 'none';
  $('#open').onclick = () => window.open(t.url,'_blank');
  $('#cur').textContent='0:00'; $('#dur').textContent='0:00'; setSeek(0);
}
function setIcon(p){
  playing = p;
  const path = p ? '<path d="M2.5 1.5h2.6v9H2.5zM6.9 1.5h2.6v9H6.9z"/>' : '<path d="M3 1.5v9l7.5-4.5z"/>';
  $('#ico').innerHTML = path; $('#mIco').innerHTML = path;
  $('#thumb').classList.toggle('spin', p); $('#mThumb').classList.toggle('spin', p);
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('ytp', {
    width:200, height:200, videoId: ytId(tracks[idx].url),
    playerVars:{ playsinline:1, controls:0, rel:0 },
    events:{
      onReady: () => { ready = true; player.setVolume(DATA.volume); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING){ setIcon(true); $('#dur').textContent = fmt(player.getDuration()); }
        else if (e.data === YT.PlayerState.PAUSED) setIcon(false);
        else if (e.data === YT.PlayerState.ENDED){ tracks.length>1 ? go(1) : (setIcon(false), setSeek(0)); }
      }
    }
  });
};
if (tracks.some(t=>ytId(t.url))){
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}

setInterval(()=>{
  if(!ready || !playing) return;
  const c = player.getCurrentTime(), d = player.getDuration();
  if(d){ $('#cur').textContent = fmt(c); setSeek(c/d*1000); }
}, 400);

$('#play').onclick = $('#mPlay').onclick = () => {
  if(!ready || !ytId(tracks[idx].url)) return;
  playing ? player.pauseVideo() : player.playVideo();
};
$('#seek').oninput = e => {
  const v = +e.target.value; setSeek(v);
  if(ready){ const d = player.getDuration(); if(d) player.seekTo(d*v/1000, true); }
};
function go(step){
  idx = (idx + step + tracks.length) % tracks.length;
  loadMeta();
  const id = ytId(tracks[idx].url);
  if(ready && id) player.loadVideoById(id);
}
$('#back').onclick = () => { if (ready && player.getCurrentTime() > 3) player.seekTo(0,true); else go(-1); };
$('#fwd').onclick = () => go(1);

const vol = $('#vol'); vol.value = DATA.volume; vol.style.setProperty('--p', DATA.volume+'%');
vol.oninput = e => { vol.style.setProperty('--p', e.target.value+'%'); if(ready) player.setVolume(+e.target.value); };

loadMeta();

/* ===== 섹션 페이지 (OC / Pair / Me) ===== */
/* ===== Pair 슬라이드 ===== */
let PI = 0, PAIRS = [];
const LOCK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="5.2" width="8" height="5.5" rx="1.2"/><path d="M4 5V3.8a2 2 0 0 1 4 0V5"/></svg>';
const ARROW_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 9 3M4 3h5v5"/></svg>';
const fixUrl = u => { u = (u||'').trim(); return u && !/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(u) ? 'https://' + u : u; };
function fillPair(){
  const c = PAIRS[PI];
  const img = $('#pImg');
  if (c.image){ img.src = c.image; img.alt = c.name || ''; img.hidden = false; $('#pNoImg').style.display = 'none'; }
  else { img.hidden = true; img.removeAttribute('src'); $('#pNoImg').style.display = ''; }
  $('#pNo').textContent = 'No.' + pad(PI+1);
  $('#pName').textContent = c.name || '';
  const desc = c.note != null ? c.note : (c.pair ? 'Pair ' + c.pair : '');
  $('#pDesc').textContent = desc; $('#pDesc').style.display = desc ? '' : 'none';
  const m = (c.since||'').split('-').map(Number);
  if (m.length === 3 && !m.some(isNaN)){
    const d = new Date(m[0], m[1]-1, m[2]), diff = Math.round((d - today)/864e5);
    $('#pD').textContent = diff > 0 ? 'D-' + diff : 'D+' + (1 - diff);
    $('#pSince').textContent = (diff > 0 ? 'ON ' : 'SINCE ') + m[0] + '.' + pad(m[1]) + '.' + pad(m[2]);
    $('#pMeta').style.display = '';
  } else $('#pMeta').style.display = 'none';
  const url = fixUrl(c.url), nm = esc(c.siteName || '사이트 방문');
  $('#pBtn').innerHTML = c.soon
    ? `<span class="pbtn">COMING SOON<i class="lk">${LOCK_SVG}</i></span>`
    : url ? `<a class="pbtn open" href="${esc(url)}" target="_blank" rel="noopener"><span class="t">${nm}</span><i class="lk">${ARROW_SVG}</i></a>`
          : (c.siteName ? `<span class="pbtn plain">${nm}</span>` : '');
  $('#pCur').textContent = pad(PI+1);
  $('#pDots').innerHTML = PAIRS.map((_,i)=>`<i class="${i===PI?'on':''}" data-i="${i}"></i>`).join('');
  $('#pDots').querySelectorAll('i').forEach(el => el.onclick = () => pairGo(+el.dataset.i - PI));
}
function pairGo(step, instant){
  if (!PAIRS.length) return;
  PI = (PI + step + PAIRS.length) % PAIRS.length;
  if (instant){ fillPair(); return; }
  const m = $('#pairMain'); m.classList.add('fade');
  setTimeout(()=>{ fillPair(); m.classList.remove('fade'); }, 160);
}
function renderPair(o){
  PAIRS = o.characters || []; PI = 0;
  const has = PAIRS.length > 0;
  $('#pairMain').style.display = has ? '' : 'none';
  $('#pairEmpty').style.display = has ? 'none' : '';
  $('#pairNav').style.visibility = has ? '' : 'hidden';
  $('#pTot').textContent = '/ ' + pad(PAIRS.length);
  if (has) fillPair();
}
$('#pPrev').onclick = () => pairGo(-1);
$('#pNext').onclick = () => pairGo(1);
document.addEventListener('keydown', e => {
  if (document.body.dataset.sec !== 'pair') return;
  if (e.key === 'ArrowLeft') pairGo(-1); else if (e.key === 'ArrowRight') pairGo(1);
});
(function(){
  let x0 = null; const m = $('#pairMain');
  m.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  m.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) pairGo(dx < 0 ? 1 : -1); });
})();

function renderSection(k){
  if (k === 'me'){ MT = 0; renderMe(); return; }
  const o = DATA[k] || {};
  $('#ocTitle').textContent = o.title || k.toUpperCase();
  $('#ocSub').textContent = o.subtitle || '';
  if (k === 'pair'){ renderPair(o); return; }
  const LOCK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="5.2" width="8" height="5.5" rx="1.2"/><path d="M4 5V3.8a2 2 0 0 1 4 0V5"/></svg>';
  const ch = o.characters || [];
  $('#ocGrid').innerHTML = ch.length ? ch.map((c,i)=>{
    const note = c.note != null ? c.note : (c.pair ? 'Pair ' + c.pair : '');
    return `<div class="oc-card"><div class="oc-img${c.soon ? ' is-soon' : ''}">${c.image ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">` : '<span class="oc-noimg">NO IMAGE</span>'}${c.soon ? `<span class="soon">${LOCK}COMING SOON</span>` : ''}</div>` +
    `<div class="oc-info"><div class="no">No.${pad(i+1)}</div><div class="nm">${esc(c.name||'')}</div>${note ? `<div class="pr">${esc(note)}</div>` : ''}</div></div>`;
  }).join('') : '<div class="oc-empty">아직 등록된 카드가 없어요</div>';
}

/* ===== Me / Profile ===== */
const pcd=(t,l,a,b)=>({tag:t,label:l,couple:'',a:{role:'OC',name:a,image:'',look:'',outfit:''},b:{role:'PAIR',name:b,image:'',look:'',outfit:''}});
const ME_DEF={v:2,title:'Profile',subtitle:'ABOUT THE ACCOUNT',avatar:'',name:'xoya',handle:'@xxxoyaaa',
 about:{profile:{title:'프로필',label:'PROFILE',fields:[{k:'NAME',v:'쏘야'},{k:'AGED',v:'성인 여성'}]},
  notice:{title:'안내',label:'Notice',rows:[
    {groups:[{label:'MAIN!',pills:[{k:'ARCH',v:'Santa',dark:true}]},{label:'SUB',pills:[{k:'Aftermess',v:'7'}]}]},
    {groups:[{label:'AND?',pills:[{k:'ARCH',v:'Blue'},{k:'Fearless',v:'Mustang'},{k:'Sizz',v:'서해영'}]}]}],
   bullets:['==유동적인 성향==으로 배려 요구치 않습니다','트친소 알티로 인한 유입마저 곤란하신 분 연결 어렵습니다','계정 방치 및 교류 없는 단순 맞구독 비정기적 정리하며 ==재연결 OK==']},
  ng:{title:'NG',label:'NOTICE',items:['산타 한정 성향 예민하신 분','언급 없는 페어의 배려 요구','성향 억측','ff 100 ↑']}},
 family:{groups:[{title:'Family Site',sites:[{title:'Text Editor',desc:'발췌 기능 포함 글자 편집기'},{title:'winter.santarchive.com',desc:'겨울 놀이동산 3D 안내'},{title:'santa.naru.pub',desc:'기존 성향글'},{title:'[Legacy] 프롬프트',desc:''}]}]},
 oc:{cards:[]},
 prompt:{cards:[pcd('탱글','ARCH','사이다','산타'),pcd('724','Aftermess','엑스','세븐'),pcd('더블','ARCH','더스티','블루'),pcd('서서','Sizz','서하리','서해영')]}};
const ME_TABS=['About','ETC','Pair Prompt','OC Prompt'];
const CP_SVG='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="4" width="6.5" height="6.5" rx="1.3"/><path d="M8 2.5H3.5a1 1 0 0 0-1 1V8"/></svg>';
let MT=0, ME=null;
const hl=t=>esc(t).replace(/==(.+?)==/g,'<mark>$1</mark>');
const sh=(n,t,l,c)=>`<div class="sh ${c||''}"><em>${pad(n)}</em><h3>${esc(t)}</h3><i></i><span>${esc(l)}</span></div>`;
function meTab(m){
  const a=m.about, f=m.family, pr=m.prompt;
  if(MT===0){
    const pl=a.profile, nt=a.notice, ng=a.ng;
    return `<div class="sec">${sh(1,pl.title,pl.label)}<div class="sb fl">${pl.fields.map(x=>`<div><small>${esc(x.k)}</small><b>${esc(x.v)}</b></div>`).join('')}</div></div>`+
    `<div class="sec">${sh(2,nt.title,nt.label)}<div class="sb">${nt.rows.map(r=>`<div class="nr">${r.groups.map(g=>`<span class="gl">${esc(g.label)}</span>${g.pills.map(p=>`<span class="pl${p.dark?' dk':''}"><i>${esc(p.k)}</i><b>${esc(p.v)}</b></span>`).join('')}`).join('')}</div>`).join('')}<ul class="bl">${nt.bullets.map(b=>`<li>${hl(b)}</li>`).join('')}</ul></div></div>`+
    `<div class="sec">${sh(3,ng.title,ng.label)}<div class="ng"><span class="ex">!</span><ol>${ng.items.map((t,i)=>`<li><small>${pad(i+1)}</small>${esc(t)}</li>`).join('')}</ol></div></div>`;
  }
  if(MT===1) return f.groups.map((g,gi)=>`<div class="sec">${sh(gi+1,g.title,g.sites.length+' SITES')}<div class="fg">${g.sites.map(s=>{
    const u=fixUrl(s.url);
    return `<${u?`a href="${esc(u)}" target="_blank" rel="noopener"`:'div'} class="fc"><div class="fi">${s.image?`<img src="${esc(s.image)}" alt="" loading="lazy">`:''}</div><div class="ft"><div><b>${esc(s.title)}</b>${s.desc?`<small>${esc(s.desc)}</small>`:''}</div>${u?`<i class="ar">${ARROW_SVG}</i>`:''}</div></${u?'a':'div'}>`;}).join('')}</div></div>`).join('') || '<div class="oc-empty">아직 등록된 사이트가 없어요</div>';
  if(MT===3){const cs=(m.oc||{cards:[]}).cards; return `<div class="pg2 oc">${cs.map((c,ci)=>`<div>${sh(ci+1,'#'+c.tag,c.label,'sm')}<div class="pi o"><div class="pim">${c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">`:''}</div></div><div class="pw" style="margin-top:8px"><em class="rl dk">OC</em>${esc(c.name)}</div><div class="pb">${[['look','외형'],['outfit','네거티브']].map(([t,n])=>`<button data-c="${ci}.o.${t}" class="${c[t]?'':'na'}">${CP_SVG}${n}</button>`).join('')}</div></div>`).join('')}</div>`+(cs.length?'':'<div class="oc-empty">아직 등록된 OC 프롬프트가 없어요</div>');}
  return `<div class="pg2">${pr.cards.map((c,ci)=>`<div>${sh(ci+1,'#'+c.tag,c.label,'sm')}<div class="pi">${[c.a,c.b].map(x=>`<div class="pim">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy">`:''}</div>`).join('')}</div><div class="pnm">${['a','b'].map((k,j)=>`<div><div class="pw"><em class="rl${j?'':' dk'}">${esc(c[k].role)}</em>${esc(c[k].name)}</div><div class="pb">${[['look','외형'],['outfit','네거티브']].map(([t,n])=>`<button data-c="${ci}.${k}.${t}" class="${c[k][t]?'':'na'}">${CP_SVG}${n}</button>`).join('')}</div></div>`).join('')}</div><div class="pb pc"><button data-c="${ci}.c.couple" class="${c.couple?'':'na'}">${CP_SVG}커플 네거티브</button></div></div>`).join('')}</div>` + (pr.cards.length?'':'<div class="oc-empty">아직 등록된 프롬프트가 없어요</div>');
}
function renderMe(){
  ME = DATA.me && DATA.me.v===2 ? Object.assign({}, ME_DEF, DATA.me) : ME_DEF;
  $('#meTitle').textContent=ME.title||'Profile'; $('#meSub').textContent=ME.subtitle||'';
  $('#meName').textContent=ME.name||''; $('#meHandle').textContent=ME.handle||'';
  $('#meAv').innerHTML = ME.avatar ? `<img src="${esc(ME.avatar)}" alt="">` : '';
  $('#meTabs').innerHTML = ME_TABS.map((t,i)=>`<button class="me-tab${i===MT?' on':''}" data-t="${i}">${t}${i===MT?'<i class="l"></i><i class="r"></i>':''}</button>`).join('');
  $('#meCur').textContent = pad(MT+1); $('#meTot').textContent = '/ ' + pad(ME_TABS.length);
  $('#meCard').classList.toggle('f1', MT===0);
  $('#meBody').innerHTML = meTab(ME);
}
$('#meTabs').addEventListener('click', e=>{ const b=e.target.closest('[data-t]'); if(!b) return; MT=+b.dataset.t; renderMe(); $('#meBody').scrollTop=0; });
$('#meBody').addEventListener('click', async e=>{
  const b=e.target.closest('[data-c]'); if(!b) return;
  const [i,k,t]=b.dataset.c.split('.'), txt=(k==='o'?ME.oc.cards[+i][t]:k==='c'?ME.prompt.cards[+i].couple:ME.prompt.cards[+i][k][t])||'';
  if(!txt) return;
  try{ await navigator.clipboard.writeText(txt); }catch(x){ const a=document.createElement('textarea'); a.value=txt; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(y){} a.remove(); }
  const o=b.innerHTML; b.textContent='복사됨 ✓'; setTimeout(()=>b.innerHTML=o,1200);
});

/* ===== 페이지 전환(해시) + 음악 접기 ===== */
let VIEW = 'home', homeCollapsed = false;
const musicEl = $('#music');
function setMusic(c){ musicEl.classList.toggle('collapsed', c); if (VIEW === 'home') homeCollapsed = c; }
musicEl.querySelector('[data-toggle]').onclick = () => setMusic(!musicEl.classList.contains('collapsed'));
$('#mOpen').onclick = () => setMusic(false);
/* 관리자 하트: 이 브라우저에서 관리자로 들어온 기록이 있을 때만 클릭 가능 */
function updateHeart(r){
  const h = $('#heart'), sec = VIEW === 'sec';
  const ok = OWNER || (sec && !!localStorage.getItem('sc_owner_' + r));
  h.classList.toggle('off', !ok);
  h.setAttribute('aria-disabled', ok ? 'false' : 'true');
  h.tabIndex = ok ? 0 : -1;
  if (ok) h.href = sec ? 'admin.html?p=' + r : 'admin.html'; else h.removeAttribute('href');
}
$('#heart').addEventListener('click', e => { if ($('#heart').classList.contains('off')) e.preventDefault(); });
function route(){
  const r = (location.hash || '').replace(/^#/, '');
  VIEW = SEC_KEYS.includes(r) ? 'sec' : 'home';
  document.body.dataset.sec = VIEW === 'sec' ? r : '';
  if (VIEW === 'sec') renderSection(r);
  updateHeart(r);
  document.body.dataset.view = VIEW;
  musicEl.classList.toggle('collapsed', VIEW === 'sec' ? true : homeCollapsed);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
